<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarefas das Meninas</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}body{background:#f6f7fb;color:#111;padding-bottom:90px}.header{background:linear-gradient(135deg,#4f46e5,#6366f1);padding:20px;color:#fff;border-radius:0 0 26px 26px}.header h1{font-size:22px}.date{display:inline-block;background:#fff;color:#4f46e5;padding:6px 12px;border-radius:99px;font-weight:700;font-size:13px;margin-top:10px}.mode{display:flex;background:rgba(255,255,255,.25);border-radius:99px;padding:3px;margin-top:12px;width:200px}.mode button{border:0;padding:8px;flex:1;border-radius:99px;font-weight:700;cursor:pointer;background:transparent;color:#fff}.mode button.active{background:#fff;color:#4f46e5}.wrap{padding:14px;max-width:520px;margin:auto}.card{background:#fff;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}.card-top{display:flex;justify-content:space-between;align-items:center}.card-top b{font-size:19px}.barra{height:8px;background:#eee;border-radius:99px;overflow:hidden;margin:10px 0}.barra div{height:100%;background:#4f46e5}.task{display:flex;gap:10px;align-items:center;padding:12px 0;border-top:1px solid #eee}.task input{width:22px;height:22px;accent-color:#4f46e5}.task span{flex:1}.task small{color:#888}.empty{text-align:center;color:#999;padding:14px}.week{display:flex;gap:6px;background:#fff;padding:6px;border-radius:16px;margin:12px 0}.week button{border:0;padding:10px;border-radius:12px;flex:1;background:transparent;cursor:pointer}.week button.active{background:#4f46e5;color:#fff}.fab{position:fixed;right:16px;bottom:20px;z-index:90;text-align:right}.fab-menu{display:none;flex-direction:column;gap:8px;margin-bottom:10px;align-items:flex-end}.fab.open .fab-menu{display:flex}.fab-menu button{border:0;padding:12px 16px;border-radius:99px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2)}.fab-main{width:56px;height:56px;border-radius:50%;background:#4f46e5;color:#fff;font-size:30px;border:0;cursor:pointer}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.box{background:#fff;border-radius:20px;padding:20px;width:100%;max-width:420px;max-height:90vh;overflow:auto}.box input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0 12px}.box button{padding:12px;border:0;border-radius:12px;font-weight:800;cursor:pointer}.chip{border:2px solid #ddd;background:#fff;padding:10px 0;border-radius:12px;cursor:pointer;font-weight:800;flex:1;text-align:center}.chip.on{background:#4f46e5;color:#fff;border-color:#4f46e5}.filhaCheck{display:flex;gap:10px;align-items:center;background:#f3f4f6;padding:12px;border-radius:14px;margin:6px 0;font-weight:700}.filhaCheck.on{background:#dcfce7;border:2px solid #22c55e}.filhaCheck input{width:22px;height:22px;accent-color:#22c55e}.topBtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.topBtns button{border:0;padding:9px 14px;border-radius:99px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.25);color:#fff}.toast{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:99px;z-index:300;max-width:90%;text-align:center}.toast.show{display:block}.whoBtn{width:100%;padding:16px;margin:6px 0;border:0;border-radius:16px;background:#4f46e5;color:#fff;font-size:18px;font-weight:700;cursor:pointer}.syncBox{background:#fff8dc;border:1px solid #fde68a;border-radius:16px;padding:14px;text-align:center;margin-top:12px}.syncBox button{width:100%;padding:13px;border:0;border-radius:12px;background:#25D366;color:#fff;font-weight:800;cursor:pointer;margin-top:10px}.codigoBox{background:#fff;border:1px dashed #999;padding:12px;border-radius:10px;font-size:20px;font-weight:800;letter-spacing:3px;text-align:center;margin:10px 0}</style></head><body>
<div class="toast" id="toast"></div>
<div class="header"><small id="subTitulo">Olá! Seja Bem Vindo!</small><h1 id="titulo">Tarefas das Meninas</h1><span class="date" id="dataTopo"></span><div class="mode" id="modeToggle"><button id="bPais" class="active">Pais</button><button id="bFilhos">Filhos</button></div><div class="topBtns" id="topBtns"><button id="btnCompartilhar">📤 Link pras filhas</button><button id="btnImportar">📥 Importar atualização</button><button id="btnNovaFilhaTop">+ Filha</button></div></div>
<div class="wrap" id="lista"></div>
<div class="fab" id="fab"><div class="fab-menu"><button style="background:#22c55e;color:#fff" id="btnNovaTarefaFab">+ 📝 Nova Tarefa</button><button style="background:#4f46e5;color:#fff" id="btnFilhaFab">+ 😃 Nova Filha</button></div><button class="fab-main" id="btnFab">+</button></div>
<div class="modal" id="modalTarefa"><div class="box"><h2>📝 Nova Tarefa</h2><label>Nome da tarefa</label><input id="inNomeTarefa" placeholder="Ex: arrumar quarto"><label>Pontos</label><input id="inPts" type="number" placeholder="Ex: 10"><p style="font-weight:800;margin:6px 0">Pra quem vai?</p><div id="listaFilhasCheck"></div><p style="font-weight:800;margin:10px 0 6px">Em quais dias?</p><div style="display:flex;gap:6px;flex-wrap:wrap" id="diasNova"><button class="chip" data-dia="Seg">Seg</button><button class="chip" data-dia="Ter">Ter</button><button class="chip" data-dia="Qua">Qua</button><button class="chip" data-dia="Qui">Qui</button><button class="chip" data-dia="Sex">Sex</button><button class="chip" data-dia="Sáb">Sáb</button><button class="chip" data-dia="Dom">Dom</button></div><div style="display:flex;gap:8px;margin-top:14px"><button style="background:#eee;flex:1" class="fechar">Cancelar</button><button style="background:#22c55e;color:#fff;flex:1" id="saveTarefa">Salvar ✅</button></div></div></div>
<div class="modal" id="modalFilha"><div class="box"><h2>+ Filha</h2><label>Nome</label><input id="inNomeFilha" placeholder="Nome da sua filha"><div style="display:flex;gap:8px"><button style="background:#eee;flex:1" class="fechar">Cancelar</button><button style="background:#4f46e5;color:#fff;flex:1" id="saveFilha">Salvar</button></div></div></div>
<div class="modal" id="modalLink"><div class="box"><h2>📤 Link pras Filhas</h2><p style="color:#666;margin:10px 0">Manda esse link pras duas, elas escolhem quem são. Nesse link não aparece nada de Pai.</p><input id="linkCopia" readonly><button style="background:#4f46e5;color:#fff;width:100%;margin-top:6px" id="btnCopiarLink">📋 Copiar link</button><button style="background:#25D366;color:#fff;width:100%;margin-top:6px" id="btnZapLink">💬 Mandar no WhatsApp</button><button style="background:#eee;width:100%;margin-top:8px" class="fechar">Fechar</button></div></div>
<div class="modal" id="modalCodigo"><div class="box"><h2 id="titCodigo">Código</h2><p id="txtCodigo" style="color:#666;margin:8px 0"></p><div class="codigoBox" id="codigoGerado"></div><input id="inCodigo" placeholder="Cole o código aqui" style="text-transform:uppercase;text-align:center;font-weight:800;letter-spacing:2px"><button style="background:#25D366;color:#fff;width:100%" id="btnZapCodigo">💬 Mandar no WhatsApp</button><button style="background:#4f46e5;color:#fff;width:100%;margin-top:6px" id="btnImportarCodigo">📥 Importar esse código</button><button style="background:#eee;width:100%;margin-top:8px" class="fechar">Fechar</button></div></div>
<script>
if(location.search.indexOf('limpar')>=0){localStorage.clear();location.href=location.pathname}
var params=new URLSearchParams(location.search);
var MODO_FILHOS_URL=params.has('filhos');
var filhaLogada=localStorage.getItem('filhaLogada')||'';
var dados=null;
try{dados=JSON.parse(localStorage.getItem('dadosClean')||'null')}catch(e){dados=null}
if(!dados||!dados.filhas){dados={filhas:[{nome:'Rafa 😍',tarefas:[]},{nome:'Soso 😍',tarefas:[]}],dia:'Seg'};salvar()}
var diasSemana=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function diaHoje(){return diasSemana[new Date().getDay()]}
function syncDia(){var hoje=new Date();var chave=hoje.getFullYear()+'-'+(hoje.getMonth()+1)+'-'+hoje.getDate();if(localStorage.getItem('ultimoDiaClean')!==chave){dados.dia=diaHoje();localStorage.setItem('ultimoDiaClean',chave);salvar()}}
syncDia();
function salvar(){try{localStorage.setItem('dadosClean',JSON.stringify(dados))}catch(e){}}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(function(){el.classList.remove('show')},2600)}
function fecharModais(){document.querySelectorAll('.modal').forEach(function(m){m.classList.remove('open')})}
function abrirModal(id){document.getElementById('fab').classList.remove('open');document.getElementById(id).classList.add('open')}
function gerarCodigo(){return dados.filhas.map(function(f){var letra=f.nome.charAt(0).toUpperCase();var bits=f.tarefas.map(function(t){return t.feito?'1':'0'}).join('')||'0';return letra+bits}).join('-')}
function importarCodigo(cod){cod=(cod||'').toUpperCase().trim().replace(/[^A-Z0-9\-]/g,'');var partes=cod.split('-');var ok=false;partes.forEach(function(p){if(p.length<2)return;var letra=p.charAt(0);var bits=p.slice(1);var f=dados.filhas.find(function(x){return x.nome.charAt(0).toUpperCase()===letra});if(f){for(var i=0;i<Math.min(bits.length,f.tarefas.length);i++){f.tarefas[i].feito=bits[i]==='1'}ok=true}});return ok}
function abrirNovaTarefa(){document.getElementById('inNomeTarefa').value='';document.getElementById('inPts').value='';var wrap=document.getElementById('listaFilhasCheck');wrap.innerHTML='';dados.filhas.forEach(function(f,i){var lab=document.createElement('label');lab.className='filhaCheck on';var chk=document.createElement('input');chk.type='checkbox';chk.checked=true;chk.setAttribute('data-idx',i);chk.addEventListener('change',function(){lab.classList.toggle('on',chk.checked)});lab.appendChild(chk);var sp=document.createElement('span');sp.textContent=f.nome;lab.appendChild(sp);wrap.appendChild(lab)});document.querySelectorAll('#diasNova .chip').forEach(function(c){c.classList.toggle('on',c.dataset.dia===dados.dia)});abrirModal('modalTarefa')}
function render(){var lista=document.getElementById('lista');lista.innerHTML='';var isFilhos=document.body.classList.contains('filhos')||MODO_FILHOS_URL;document.getElementById('dataTopo').textContent=dados.dia+', '+new Date().getDate()+' de Nov';if(isFilhos&&MODO_FILHOS_URL&&!filhaLogada){var h=document.createElement('h2');h.style.textAlign='center';h.textContent='Olá! Quem é você? 💜';lista.appendChild(h);dados.filhas.forEach(function(f){var b=document.createElement('button');b.className='whoBtn';b.textContent=f.nome;b.onclick=function(){filhaLogada=f.nome;localStorage.setItem('filhaLogada',f.nome);render()};lista.appendChild(b)});return}var mostrar=dados.filhas;if(isFilhos&&MODO_FILHOS_URL&&filhaLogada){mostrar=dados.filhas.filter(function(f){return f.nome===filhaLogada})}mostrar.forEach(function(f){var hoje=f.tarefas.filter(function(t){return t.dia===dados.dia});var feitos=hoje.filter(function(t){return t.feito}).length;var pts=0;f.tarefas.forEach(function(t){if(t.feito)pts+=Number(t.pts||0)});var card=document.createElement('div');card.className='card';var top=document.createElement('div');top.className='card-top';top.innerHTML='<b>'+f.nome+'</b><span><b>'+pts+' pts</b> • '+feitos+'/'+hoje.length+' hoje</span>';var barra=document.createElement('div');barra.className='barra';barra.innerHTML='<div style="width:'+(hoje.length?Math.round(feitos/hoje.length*100):0)+'%"></div>';card.appendChild(top);card.appendChild(barra);if(!hoje.length){var e=document.createElement('div');e.className='empty';e.textContent='Nenhuma tarefa hoje 🎉';card.appendChild(e)}hoje.forEach(function(t){var row=document.createElement('label');row.className='task';var chk=document.createElement('input');chk.type='checkbox';chk.checked=t.feito;chk.onchange=function(){t.feito=chk.checked;salvar();render()};var sp=document.createElement('span');sp.textContent=t.nome;var sm=document.createElement('small');sm.textContent=(t.pts||0)+' pts';row.appendChild(chk);row.appendChild(sp);row.appendChild(sm);if(!isFilhos){var del=document.createElement('button');del.textContent='🗑️';del.style.cssText='border:0;background:transparent;cursor:pointer;font-size:16px';del.onclick=function(e){e.preventDefault();e.stopPropagation();if(confirm('Excluir "'+t.nome+'"?')){f.tarefas.splice(f.tarefas.indexOf(t),1);salvar();render()}};row.appendChild(del)}card.appendChild(row)});lista.appendChild(card)});var week=document.createElement('div');week.className='week';['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].forEach(function(d){var b=document.createElement('button');b.textContent=d;if(d===dados.dia)b.classList.add('active');b.onclick=function(){dados.dia=d;salvar();render()};week.appendChild(b)});lista.appendChild(week);if(isFilhos){var sync=document.createElement('div');sync.className='syncBox';sync.innerHTML='<b>✅ Terminou?</b><p>Manda o código curtinho pra mamãe.</p>';var btn=document.createElement('button');btn.textContent='✅ Terminei - gerar código pra mamãe';btn.onclick=function(){var cod=gerarCodigo();document.getElementById('titCodigo').textContent='Seu código pra mamãe';document.getElementById('txtCodigo').textContent='Copia esse código e manda pra mamãe no WhatsApp.';document.getElementById('codigoGerado').textContent=cod;document.getElementById('inCodigo').value=cod;window._codigoAtual=cod;abrirModal('modalCodigo')};sync.appendChild(btn);lista.appendChild(sync)}}
function irPais(){document.body.classList.remove('filhos');document.getElementById('bPais').classList.add('active');document.getElementById('bFilhos').classList.remove('active');document.getElementById('titulo').textContent='Tarefas das Meninas';document.getElementById('subTitulo').textContent='Olá! Seja Bem Vindo!';document.getElementById('modeToggle').style.display='flex';document.getElementById('topBtns').style.display='flex';document.getElementById('fab').style.display='block';render()}
function irFilhos(){document.body.classList.add('filhos');document.getElementById('bFilhos').classList.add('active');document.getElementById('bPais').classList.remove('active');document.getElementById('titulo').textContent='Minhas Tarefas';document.getElementById('subTitulo').textContent='Olá!';document.getElementById('modeToggle').style.display='none';document.getElementById('topBtns').style.display='none';document.getElementById('fab').style.display='none';render()}
document.getElementById('bPais').onclick=irPais;document.getElementById('bFilhos').onclick=irFilhos;
document.getElementById('btnFab').onclick=function(e){e.stopPropagation();document.getElementById('fab').classList.toggle('open')};
document.getElementById('btnNovaTarefaFab').onclick=function(){abrirNovaTarefa()};
document.getElementById('btnFilhaFab').onclick=function(){document.getElementById('inNomeFilha').value='';abrirModal('modalFilha')};
document.getElementById('btnNovaFilhaTop').onclick=function(){document.getElementById('inNomeFilha').value='';abrirModal('modalFilha')};
document.getElementById('btnCompartilhar').onclick=function(){var link=location.href.split('?')[0]+'?filhos';document.getElementById('linkCopia').value=link;abrirModal('modalLink')};
document.getElementById('btnCopiarLink').onclick=function(){var i=document.getElementById('linkCopia');i.select();try{navigator.clipboard.writeText(i.value)}catch(e){document.execCommand('copy')};toast('Link copiado!')};
document.getElementById('btnZapLink').onclick=function(){window.open('https://wa.me/?text='+encodeURIComponent('Oi filhas! 💜 Abre aqui suas tarefas: '+document.getElementById('linkCopia').value),'_blank')};
document.getElementById('btnImportar').onclick=function(){document.getElementById('titCodigo').textContent='Importar atualização';document.getElementById('txtCodigo').textContent='Cole o código que sua filha te mandou. Ex: R101-S10';document.getElementById('codigoGerado').textContent='Cole abaixo';document.getElementById('inCodigo').value='';abrirModal('modalCodigo')};
document.getElementById('btnZapCodigo').onclick=function(){var cod=document.getElementById('inCodigo').value||window._codigoAtual||'';window.open('https://wa.me/?text='+encodeURIComponent('Mamãe, terminei! 💜 Meu código é: '+cod),'_blank')};
document.getElementById('btnImportarCodigo').onclick=function(){var cod=document.getElementById('inCodigo').value;if(importarCodigo(cod)){salvar();fecharModais();render();toast('✅ Atualizado com o que ela fez!')}else{toast('Código inválido. Ex: R101-S10')}};
document.querySelectorAll('#diasNova .chip').forEach(function(c){c.onclick=function(){c.classList.toggle('on')}});
document.getElementById('saveTarefa').onclick=function(){var nome=document.getElementById('inNomeTarefa').value.trim();if(!nome){toast('Escreve o nome da tarefa');return}var pts=document.getElementById('inPts').value.trim();var idxs=[];document.querySelectorAll('#listaFilhasCheck input:checked').forEach(function(c){idxs.push(parseInt(c.dataset.idx))});if(!idxs.length){toast('Flega pelo menos 1 filha');return}var dias=[];document.querySelectorAll('#diasNova .chip.on').forEach(function(c){dias.push(c.dataset.dia)});if(!dias.length){toast('Flega pelo menos 1 dia');return}idxs.forEach(function(fi){dias.forEach(function(d){var f=dados.filhas[fi];if(!f.tarefas.some(function(t){return t.nome===nome&&t.dia===d})){f.tarefas.push({nome:nome,pts:pts,dia:d,feito:false})}})});salvar();fecharModais();render();toast('✅ Criado!')};
document.getElementById('saveFilha').onclick=function(){var n=document.getElementById('inNomeFilha').value.trim();if(!n)return;dados.filhas.push({nome:n,tarefas:[]});salvar();fecharModais();render()};
document.querySelectorAll('.fechar').forEach(function(b){b.onclick=fecharModais});
document.querySelectorAll('.modal').forEach(function(m){m.onclick=function(e){if(e.target===m)fecharModais()}});
document.addEventListener('click',function(e){if(!e.target.closest('.fab'))document.getElementById('fab').classList.remove('open')});
if(MODO_FILHOS_URL){irFilhos()}else{irPais()}
</script></body></html>
