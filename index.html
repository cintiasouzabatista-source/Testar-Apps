<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Pais e Filhos: Conexão e Astrologia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col items-center justify-center p-4">

    <div id="app" class="w-full max-w-xl bg-white rounded-3xl shadow-xl overflow-hidden border border-sky-100">
        <!-- Conteúdo dinâmico -->
    </div>

    <script>
        const questions = [
            {
                id: 1,
                question: "O que mais me dá preguiça ou me irrita na rotina de casa?",
                options: [
                    "Quando mandam eu parar o que estou fazendo na hora",
                    "A cobrança constante para arrumar o quarto ou organizar coisas",
                    "Acordar cedo e a correria para sair",
                    "Quando ninguém me ouve ou prestam atenção no celular"
                ]
            },
            {
                id: 2,
                question: "O que eu mais sinto falta de fazermos juntos?",
                options: [
                    "Conversar sem pressa sobre o dia ou sobre a vida",
                    "Sair para passear, comer algo gostoso ou viajar",
                    "Assistir a filmes, séries ou jogar juntos",
                    "Ficar em silêncio curtindo a companhia um do outro"
                ]
            },
            {
                id: 3,
                question: "Quando eu fico chateado(a) ou estressado(a), qual é a melhor forma de me ajudar?",
                options: [
                    "Me dar espaço e deixar eu ficar sozinho(a) um pouco",
                    "Chegar junto, me abraçar e oferecer ajuda",
                    "Me fazer rir ou mudar de assunto para distrair",
                    "Me ouvir desabafar sem dar bronca ou julgamento"
                ]
            },
            {
                id: 4,
                question: "Se pudéssemos mudar uma única regra em casa por uma semana, qual seria?",
                options: [
                    "Zero horários rígidos para dormir ou acordar",
                    "Liberdade total para escolher a comida ou pedir delivery",
                    "Menos cobrança com tarefas e obrigações",
                    "Mais tempo livre sem telas ou cobranças"
                ]
            },
            {
                id: 5,
                question: "O que eu mais admiro em você (mas às vezes esqueço de dizer)?",
                options: [
                    "Seu jeito paciente e compreensivo nas horas difíceis",
                    "Sua dedicação, força de vontade e coragem",
                    "O quanto você me faz rir e deixa o dia mais leve",
                    "Seu cuidado e o quanto se importa com o meu bem-estar"
                ]
            }
        ];

        let state = {
            step: 'welcome',
            role: '', // 'parent' ou 'child'
            parentData: { name: '', birthdate: '', message: '' },
            childData: { name: '', birthdate: '', message: '' },
            currentQuestionIndex: 0,
            answers: [],
            shareLink: ''
        };

        // Ao carregar a página, verifica se há dados na URL (caso seja o filho abrindo o link do pai)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const pName = urlParams.get('pName');
            
            if (pName) {
                // Significa que o pai preencheu e mandou o link para o filho
                state.parentData = {
                    name: decodeURIComponent(pName),
                    birthdate: urlParams.get('pDate') || '',
                    message: decodeURIComponent(urlParams.get('pMsg') || '')
                };
                state.step = 'childWelcome';
            }
            render();
        };

        function getSign(dateStr) {
            if (!dateStr) return "Desconhecido";
            const [year, month, day] = dateStr.split('-').map(Number);
            
            if ((month == 3 && day >= 21) || (month == 4 && day <= 20)) return "Áries ♈";
            if ((month == 4 && day >= 21) || (month == 5 && day <= 20)) return "Touro ♉";
            if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return "Gêmeos ♊";
            if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return "Câncer ♋";
            if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return "Leão ♌";
            if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return "Virgem ♍";
            if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return "Libra ♎";
            if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return "Escorpião ♏";
            if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return "Sagitário ♐";
            if ((month == 12 && day >= 22) || (month == 1 && day <= 20)) return "Capricórnio ♑";
            if ((month == 1 && day >= 21) || (month == 2 && day <= 18)) return "Aquário ♒";
            return "Peixes ♓";
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (state.step === 'welcome') {
                app.innerHTML = `
                    <div class="p-8 text-center">
                        <div class="w-20 h-20 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
                            ✨
                        </div>
                        <h1 class="text-2xl sm:text-3xl font-bold text-sky-900 mb-3">Conexão Pais & Filhos</h1>
                        <p class="text-slate-600 text-base sm:text-lg mb-8 leading-relaxed">
                            Responda o quiz, deixe sua mensagem e envie o link para o seu filho(a) completar a experiência!
                        </p>
                        <button onclick="startParentFlow()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-4 px-6 rounded-2xl text-lg shadow-lg transition transform active:scale-95">
                            Começar como Pai / Mãe 🚀
                        </button>
                    </div>
                `;
            } else if (state.step === 'childWelcome') {
                app.innerHTML = `
                    <div class="p-8 text-center">
                        <div class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
                            💌
                        </div>
                        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900 mb-3">Você recebeu um convite!</h1>
                        <p class="text-slate-600 text-base mb-6 leading-relaxed">
                            <b>${state.parentData.name}</b> já respondeu a parte dele(a) e te mandou este link. Agora é a sua vez de responder e ver o resultado!
                        </p>
                        <button onclick="startChildFlow()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-4 px-6 rounded-2xl text-lg shadow-lg transition">
                            Responder Agora 🧒
                        </button>
                    </div>
                `;
            } else if (state.step === 'identification') {
                const isParent = state.role === 'parent';
                app.innerHTML = `
                    <div class="p-6 sm:p-8">
                        <h2 class="text-2xl font-bold text-sky-900 mb-2">${isParent ? 'Seus Dados (Pai / Mãe)' : 'Seus Dados (Filho / Filha)'}</h2>
                        <p class="text-slate-600 mb-6 text-sm">Insira seu nome e data de nascimento:</p>
                        
                        <div class="space-y-4 mb-6">
                            <div>
                                <label class="block text-slate-700 font-semibold mb-2 text-sm">Seu Nome:</label>
                                <input type="text" id="userName" value="${isParent ? state.parentData.name : state.childData.name}" class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none text-slate-700 text-base" placeholder="Ex: Cíntia / Sophya">
                            </div>
                            <div>
                                <label class="block text-slate-700 font-semibold mb-2 text-sm">Sua Data de Nascimento:</label>
                                <input type="date" id="userDate" value="${isParent ? state.parentData.birthdate : state.childData.birthdate}" class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none text-slate-700 text-base">
                            </div>
                        </div>

                        <button onclick="saveIdentification()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-4 px-6 rounded-2xl text-lg shadow-lg transition">
                            Avançar para o Quiz 🎯
                        </button>
                    </div>
                `;
            } else if (state.step === 'quiz') {
                const q = questions[state.currentQuestionIndex];
                const progress = ((state.currentQuestionIndex + 1) / questions.length) * 100;
                
                app.innerHTML = `
                    <div class="p-6 sm:p-8">
                        <div class="flex justify-between items-center mb-4">
                            <span class="text-xs font-bold uppercase tracking-wider bg-sky-100 text-sky-700 px-3 py-1 rounded-full">
                                Pergunta ${state.currentQuestionIndex + 1} de ${questions.length}
                            </span>
                            <span class="text-sm font-semibold text-slate-500">${state.role === 'parent' ? state.parentData.name : state.childData.name}</span>
                        </div>
                        
                        <div class="w-full bg-slate-100 h-2.5 rounded-full mb-6 overflow-hidden">
                            <div class="bg-sky-600 h-2.5 rounded-full transition-all duration-300" style="width: ${progress}%"></div>
                        </div>

                        <h3 class="text-xl sm:text-2xl font-bold text-slate-900 mb-6 leading-snug">
                            ${q.question}
                        </h3>

                        <div class="space-y-3">
                            ${q.options.map((opt, idx) => `
                                <button onclick="selectAnswer(${idx})" class="w-full text-left p-4 sm:p-5 rounded-2xl border-2 border-slate-100 hover:border-sky-500 hover:bg-sky-50 text-slate-700 hover:text-sky-900 font-medium text-base sm:text-lg transition shadow-sm">
                                    ${opt}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (state.step === 'messageInput') {
                const isParent = state.role === 'parent';
                app.innerHTML = `
                    <div class="p-6 sm:p-8">
                        <h2 class="text-2xl font-bold text-slate-900 mb-2">Deixe sua Mensagem</h2>
                        <p class="text-slate-600 text-sm sm:text-base mb-6">
                            ${isParent ? 'Escreva uma mensagem especial para o seu filho ou filha:' : 'Escreva uma mensagem especial para o seu pai ou mãe:'}
                        </p>

                        <textarea id="customMessage" rows="5" class="w-full p-4 rounded-2xl border-2 border-slate-200 focus:border-sky-500 focus:outline-none text-slate-700 text-base mb-6 resize-none" placeholder="Digite aqui o que você gostaria de dizer com o coração aberto..."></textarea>

                        <button onclick="saveMessage()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-4 px-6 rounded-2xl text-lg shadow-lg transition">
                            Gerar Link para Enviar 🔗
                        </button>
                    </div>
                `;
            } else if (state.step === 'shareScreen') {
                app.innerHTML = `
                    <div class="p-6 sm:p-8 text-center">
                        <div class="w-16 h-16 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                            🔗
                        </div>
                        <h2 class="text-2xl font-bold text-slate-900 mb-2">Sua parte está pronta!</h2>
                        <p class="text-slate-600 text-sm mb-6">
                            Agora copie o link abaixo e mande para seu filho(a) no WhatsApp. Quando ele(a) abrir, vai responder a parte dele(a) e o mural completo vai aparecer!
                        </p>

                        <div class="bg-slate-50 border-2 border-slate-200 p-3 rounded-2xl text-xs text-slate-600 break-all mb-4 select-all">
                            ${state.shareLink}
                        </div>

                        <button onclick="copyLink()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-4 px-6 rounded-2xl text-lg shadow-lg transition mb-3">
                            📋 Copiar Link
                        </button>
                    </div>
                `;
            } else if (state.step === 'finalSummary') {
                const pSign = getSign(state.parentData.birthdate);
                const cSign = getSign(state.childData.birthdate);

                app.innerHTML = `
                    <div class="p-6 sm:p-8">
                        <div class="text-center mb-6">
                            <span class="text-3xl">🌟</span>
                            <h2 class="text-2xl font-bold text-slate-900 mt-2">Mural de Conexão & Astrologia</h2>
                            <p class="text-slate-600 text-sm">Resumo da sintonia entre pais e filhos!</p>
                        </div>

                        <div class="grid grid-cols-2 gap-4 mb-6">
                            <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-2xl text-center">
                                <span class="text-xs font-bold text-indigo-500 uppercase">Pai / Mãe</span>
                                <h4 class="font-bold text-indigo-900 text-lg mt-1">${state.parentData.name || 'Pai/Mãe'}</h4>
                                <p class="text-sm font-semibold text-indigo-700 mt-1">${pSign}</p>
                            </div>
                            <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-2xl text-center">
                                <span class="text-xs font-bold text-emerald-500 uppercase">Filho / Filha</span>
                                <h4 class="font-bold text-emerald-900 text-lg mt-1">${state.childData.name || 'Filho(a)'}</h4>
                                <p class="text-sm font-semibold text-emerald-700 mt-1">${cSign}</p>
                            </div>
                        </div>

                        <div class="space-y-4 mb-6">
                            <div class="bg-indigo-50 border-2 border-indigo-100 p-5 rounded-2xl">
                                <h4 class="font-bold text-indigo-900 mb-2 text-sm flex items-center gap-2">💌 Mensagem de ${state.parentData.name || 'Pai/Mãe'}:</h4>
                                <p class="text-slate-700 italic text-sm sm:text-base leading-relaxed">"${state.parentData.message || 'Nenhuma mensagem.'}"</p>
                            </div>

                            <div class="bg-emerald-50 border-2 border-emerald-100 p-5 rounded-2xl">
                                <h4 class="font-bold text-emerald-900 mb-2 text-sm flex items-center gap-2">💌 Mensagem de ${state.childData.name || 'Filho(a)'}:</h4>
                                <p class="text-slate-700 italic text-sm sm:text-base leading-relaxed">"${state.childData.message || 'Nenhuma mensagem.'}"</p>
                            </div>
                        </div>

                        <button onclick="resetApp()" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold py-3 px-6 rounded-2xl text-base transition">
                            Reiniciar / Novo Quiz 🔄
                        </button>
                    </div>
                `;
            }
        }

        function startParentFlow() {
            state.role = 'parent';
            state.step = 'identification';
            render();
        }

        function startChildFlow() {
            state.role = 'child';
            state.step = 'identification';
            render();
        }

        function saveIdentification() {
            const name = document.getElementById('userName').value.trim();
            const date = document.getElementById('userDate').value;

            if (!name || !date) {
                alert('Por favor, preencha o nome e a data de nascimento!');
                return;
            }

            if (state.role === 'parent') {
                state.parentData.name = name;
                state.parentData.birthdate = date;
            } else {
                state.childData.name = name;
                state.childData.birthdate = date;
            }

            state.currentQuestionIndex = 0;
            state.answers = [];
            state.step = 'quiz';
            render();
        }

        function selectAnswer(optionIndex) {
            state.answers.push({
                questionId: questions[state.currentQuestionIndex].id,
                selectedOption: optionIndex
            });

            if (state.currentQuestionIndex < questions.length - 1) {
                state.currentQuestionIndex++;
                render();
            } else {
                state.step = 'messageInput';
                render();
            }
        }

        function saveMessage() {
            const msgInput = document.getElementById('customMessage');
            const val = msgInput ? msgInput.value.trim() : '';
            
            if (state.role === 'parent') {
                state.parentData.message = val;
                
                // Gera o link contendo os dados do pai
                const baseUrl = window.location.origin + window.location.pathname;
                state.shareLink = `${baseUrl}?pName=${encodeURIComponent(state.parentData.name)}&pDate=${state.parentData.birthdate}&pMsg=${encodeURIComponent(state.parentData.message)}`;
                
                state.step = 'shareScreen';
            } else {
                state.childData.message = val;
                state.step = 'finalSummary';
            }
            render();
        }

        function copyLink() {
            navigator.clipboard.writeText(state.shareLink).then(() => {
                alert('Link copiado com sucesso! Agora é só colar no WhatsApp para o seu filho(a).');
            }).catch(err => {
                alert('Não foi possível copiar automaticamente. Selecione o link acima e copie manualmente.');
            });
        }

        function resetApp() {
            window.location.href = window.location.pathname; // Limpa a URL e reinicia
        }
    </script>
</body>
</html>
