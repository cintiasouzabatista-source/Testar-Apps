<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Frota</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root { --primary: #2563eb; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; --muted: #94a3b8; --border: #334155; --danger: #ef4444; --warning: #facc15; }
body.estrada { --primary: #ea580c; --bg: #1c1917; --card: #292524; --text: #fafaf9; --muted: #a8a29e; --border: #44403c; }
body.white { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --muted: #64748b; --border: #e2e8f0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui; background: var(--bg); color: var(--text); padding-bottom: 80px; transition: 0.3s; position: relative; }
.container { max-width: 600px; margin: 0 auto; padding: 16px; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px }
.header-actions { display: flex; gap: 8px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-icon { background: var(--card); border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; cursor: pointer; color: var(--text); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; width: 100%; text-decoration: none; }
.btn-icon.small { padding: 6px 8px; font-size: 13px; width: auto; }
.btn-danger { background: var(--danger); color: #fff; border: none; }
input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); margin-top: 4px; font-size: 14px; }
label { font-size: 11px; color: var(--muted); font-weight: 600; display: block; margin-top: 6px; }
.kpi p { color: var(--muted); font-size: 12px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.kpi h3 { font-size: 24px; font-weight: 700; }
.odometro { background: linear-gradient(135deg, var(--primary), #1d4ed8); border: none; color: #fff; padding: 12px 16px; }
.odometro p { color: rgba(255,255,255,0.9); font-size: 11px; margin-bottom: 4px; }
.odometro-header { display:flex; justify-content:space-between; align-items:center }
.odometro h3 { font-size: 20px; }
.odometro small { color: rgba(255,255,255,0.8); font-size: 11px; }

.nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; z-index: 50; }
.nav-btn { background: none; border: none; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 20%; }
.nav-btn.active { color: var(--primary); }
.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); justify-content:center; align-items:center; z-index:100 }
.modal-content { background:var(--card); padding:16px; border-radius:16px; width:92%; max-width:480px; max-height:90vh; overflow-y:auto }
.modal-actions { display:flex; gap:8px; margin-top:12px }

.accordion-grupo { margin-bottom: 8px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--bg); }
.accordion-header { padding: 10px 14px; background: var(--card); cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 13px; color: var(--text); user-select: none; }
.accordion-header:hover { color: var(--primary); }
.accordion-body { padding: 12px; display: none; border-top: 1px solid var(--border); }
.accordion-grupo.aberto .accordion-body { display: block; }
.accordion-grupo.aberto .accordion-header { background: var(--primary); color: #fff; }

.historico-item { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.historico-resumo { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
.view-section { display: none; }
.view-section.active { display: block; }

.chart-horiz-row { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; overflow: hidden; height: 38px; position: relative; }
.chart-horiz-bar { background: var(--primary); height: 100%; display: flex; align-items: center; padding: 0 10px; color: #fff; font-weight: 700; font-size: 12px; transition: width 0.4s ease; white-space: nowrap; gap: 6px; }
.chart-horiz-info { position: absolute; right: 12px; font-size: 12px; color: var(--muted); font-weight: 600; z-index: 2; pointer-events: none; }
.filtro-container { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
.filtro-container select { margin-top: 0; }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Controle Frota</h1>
        <div class="header-actions">
            <button class="btn-icon" style="width: auto;" onclick="abrirModalConfig()"><i class="fas fa-cog"></i></button>
            <button class="btn-icon" style="width: auto;" onclick="trocarTema()"><i id="iconTema" class="fas fa-palette"></i></button>
        </div>
    </div>
    
    <!-- ABA INÍCIO -->
    <div id="viewInicio" class="view-section active">
        <select id="selectVeiculo" class="card" style="width:100%; padding:12px; font-size:16px; margin-bottom:12px;" onchange="trocarVeiculo(this.value)"></select>

        <div class="grid-2" style="margin-bottom: 12px">
            <button class="btn-icon" onclick="abrirModalAbast()"><i class="fas fa-gas-pump"></i> Combustível</button>
            <button class="btn-icon" onclick="abrirModalManut()"><i class="fas fa-wrench"></i> Manutenção</button>
        </div>

        <div class="card odometro kpi">
            <div class="odometro-header">
                <div>
                    <p><i class="fas fa-road"></i> KM ATUAL</p>
                    <h3 id="kmRodados">0 km</h3>
                </div>
                <button class="btn-icon small" onclick="abrirModalKm()"><i class="fas fa-pen"></i></button>
            </div>
            <small id="consumoMedia">Consumo: -- km/L</small>
        </div>
    </div>

    <!-- ABA GRÁFICOS -->
    <div id="viewGraficos" class="view-section">
        <div class="card">
            <div class="filtro-container">
                <div style="flex: 1;">
                    <label style="margin-top: 0;">Filtrar Período (Gráficos)</label>
                    <select id="filtroPeriodoGraficos" onchange="renderizarGraficos()">
                        <option value="todos">Todo o Histórico</option>
                        <option value="30">Últimos 30 Dias</option>
                        <option value="90">Últimos 90 Dias</option>
                        <option value="365">Último Ano</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="card">
            <h3 style="margin-bottom: 12px; font-size: 15px;"><i class="fas fa-chart-line"></i> Eficiência de Consumo (km/L)</h3>
            <div id="containerGraficoConsumo"></div>
        </div>
        <div class="card">
            <h3 style="margin-bottom: 12px; font-size: 15px;"><i class="fas fa-chart-bar"></i> Gastos por Abastecimento (R$)</h3>
            <div id="containerGraficoGastos"></div>
        </div>
    </div>
</div>

<nav class="nav-bottom">
    <button class="nav-btn active" onclick="mudarAba('Inicio', this)" id="btnNavInicio"><i class="fas fa-home"></i> Início</button>
    <button class="nav-btn" onclick="mudarAba('Graficos', this)" id="btnNavGraficos"><i class="fas fa-chart-pie"></i> Gráficos</button>
    <button class="nav-btn" onclick="abrirModalHistorico()"><i class="fas fa-list"></i> Hist.</button>
    <button class="nav-btn" onclick="abrirModalVeiculo()"><i class="fas fa-motorcycle"></i> Veículos</button>
</nav>

<!-- MODAL KM -->
<div id="modalKm" class="modal">
    <div class="modal-content">
        <h3>Atualizar KM Atual</h3>
        <label>KM Atual</label>
        <input id="kmInput" type="number">
        <div class="modal-actions">
            <button onclick="fecharModalKm()" class="btn-icon">Cancelar</button>
            <button onclick="salvarKm()" class="btn-icon" style="background:var(--primary); color:#fff">Salvar</button>
        </div>
    </div>
</div>

<!-- MODAL VEÍCULO (Com KM Aquisição e KM Atual separados) -->
<div id="modalVeiculo" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom: 10px; font-size:16px;"><i class="fas fa-motorcycle"></i> Gerenciar Veículos</h3>
        
        <div class="accordion-grupo aberto" id="accNovo">
            <div class="accordion-header" onclick="alternarAccordion('accNovo')">
                <span><i class="fas fa-plus-circle"></i> Cadastrar Novo Veículo</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="accordion-body">
                <div class="grid-2">
                    <div><label>Tipo</label><select id="vTipo"><option value="moto">Moto</option><option value="carro">Carro</option></select></div>
                    <div><label>Nome</label><input id="vNome" placeholder="Ex: Honda Lead"></div>
                </div>
                <div class="grid-2">
                    <div><label>Modelo</label><input id="vModelo" placeholder="Ex: 110"></div>
                    <div><label>Data Aquisição</label><input id="vDataAquisicao" type="date"></div>
                </div>
                <div class="grid-2">
                    <div><label>KM de Aquisição (Fixo)</label><input id="vKmAquisicao" type="number" placeholder="Ex: 0"></div>
                    <div><label>KM Atual Inicial</label><input id="vKm" type="number" placeholder="Ex: 0"></div>
                </div>
                <div class="modal-actions"><button onclick="salvarVeiculo()" class="btn-icon" style="background:var(--primary); color:#fff; width:100%;">Salvar Novo Veículo</button></div>
            </div>
        </div>

        <div class="accordion-grupo" id="accEditar">
            <div class="accordion-header" onclick="alternarAccordion('accEditar')">
                <span><i class="fas fa-edit"></i> Editar Veículo Ativo</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="accordion-body">
                <div class="grid-2">
                    <div><label>Tipo</label><select id="vTipoEdit"><option value="moto">Moto</option><option value="carro">Carro</option></select></div>
                    <div><label>Nome</label><input id="vNomeEdit"></div>
                </div>
                <div class="grid-2">
                    <div><label>Modelo</label><input id="vModeloEdit"></div>
                    <div><label>Data Aquisição</label><input id="vDataAquisicaoEdit" type="date"></div>
                </div>
                <div class="grid-2">
                    <div><label>KM de Aquisição (Fixo)</label><input id="vKmAquisicaoEdit" type="number" readonly style="opacity: 0.7; cursor: not-allowed;"></div>
                    <div><label>KM Atual</label><input id="vKmEdit" type="number"></div>
                </div>
                <div class="modal-actions"><button onclick="atualizarVeiculo()" class="btn-icon" style="background:var(--primary); color:#fff; width:100%;">Atualizar Veículo</button></div>
            </div>
        </div>

        <div class="modal-actions" style="margin-top:10px;"><button onclick="fecharModalVeiculo()" class="btn-icon" style="width:100%;">Fechar</button></div>
    </div>
</div>

<!-- MODAL HISTÓRICO COM FILTROS -->
<div id="modalHistorico" class="modal">
    <div class="modal-content">
        <h3 style="margin-bottom: 8px;"><i class="fas fa-list"></i> Histórico Completo</h3>
        <div class="filtro-container">
            <div style="flex: 1;">
                <label style="margin-top:0;">Filtrar Tipo</label>
                <select id="filtroHistoricoTipo" onchange="renderHistorico()">
                    <option value="todos">Todos</option>
                    <option value="abast">Abastecimentos</option>
                    <option value="manut">Manutenções</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label style="margin-top:0;">Período</label>
                <select id="filtroHistoricoPeriodo" onchange="renderHistorico()">
                    <option value="todos">Todo o Período</option>
                    <option value="30">Últimos 30 Dias</option>
                    <option value="90">Últimos 90 Dias</option>
                    <option value="365">Último Ano</option>
                </select>
            </div>
        </div>
        <div id="listaHistorico" style="margin-top:10px; max-height: 50vh; overflow-y: auto;"></div>
        <button onclick="fecharModalHistorico()" class="btn-icon" style="width:100%; margin-top:12px">Fechar</button>
    </div>
</div>

<!-- Outros modais estáticos de apoio -->
<div id="modalAbast" class="modal"><div class="modal-content"><h3>Abastecimento</h3><div class="modal-actions"><button onclick="fecharModalAbast()" class="btn-icon" style="width:100%;">Fechar</button></div></div></div>
<div id="modalManut" class="modal"><div class="modal-content"><h3>Manutenção</h3><div class="modal-actions"><button onclick="fecharModalManut()" class="btn-icon" style="width:100%;">Fechar</button></div></div></div>
<div id="modalConfig" class="modal"><div class="modal-content"><h3>Configurações</h3><div class="modal-actions"><button onclick="fecharModalConfig()" class="btn-icon" style="width:100%;">Fechar</button></div></div></div>

<script>
const CHAVE_STORAGE = 'veiculos_frota_v16';
const CHAVE_ATIVO = 'veiculoAtivoId_frota_v16';

let veiculos = JSON.parse(localStorage.getItem(CHAVE_STORAGE) || '[]');
let veiculoAtivoId = localStorage.getItem(CHAVE_ATIVO) || null;
let tema = localStorage.getItem('tema_frota') || 'dark';

function aplicarTema() { document.body.className = tema; const icon = document.getElementById('iconTema'); if(icon) icon.className = tema === 'dark' ? 'fas fa-moon' : tema === 'estrada' ? 'fas fa-road' : 'fas fa-sun'; }
function trocarTema() { let temas = ['dark', 'estrada', 'white']; tema = temas[(temas.indexOf(tema) + 1) % 3]; localStorage.setItem('tema_frota', tema); aplicarTema(); }

function getVeiculoAtivo() { 
    if(!veiculoAtivoId && veiculos.length) { veiculoAtivoId = veiculos[0].id; salvarTudo(); } 
    return veiculos.find(v => v.id === veiculoAtivoId) || null; 
}
function salvarTudo() { localStorage.setItem(CHAVE_STORAGE, JSON.stringify(veiculos)); localStorage.setItem(CHAVE_ATIVO, veiculoAtivoId); }
function formatarDataCurta(dataStr) { if(!dataStr) return '--/--'; const [ano, mes, dia] = dataStr.split('-'); return `${dia}/${mes}`; }

function mudarAba(nomeAba, el) {
    document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('view' + nomeAba).classList.add('active');
    if(el) el.classList.add('active');
    if(nomeAba === 'Graficos') renderizarGraficos();
}

function filtrarPorDias(lista, dias) {
    if(dias === 'todos') return lista;
    const limite = new Date();
    limite.setDate(limite.getDate() - parseInt(dias));
    return lista.filter(item => new Date(item.data) >= limite);
}

function atualizarPainel() {
    const v = getVeiculoAtivo(); if(!v) return;
    renderSelectVeiculo();
    
    // Garante compatibilidade caso o veículo antigo não tenha kmAquisicao
    if(v.kmAquisicao === undefined) v.kmAquisicao = v.config?.kmBase || 0;
    if(!v.config) v.config = {};
    if(!v.config.kmBase) v.config.kmBase = v.kmAquisicao;

    const kmAtual = v.config.kmBase || 0;
    const elKm = document.getElementById('kmRodados');
    if(elKm) elKm.textContent = kmAtual.toLocaleString('pt-BR') + ' km';
    
    if(document.getElementById('viewGraficos').classList.contains('active')) renderizarGraficos();
}

function renderSelectVeiculo() {
    const sel = document.getElementById('selectVeiculo');
    if(!sel) return;
    sel.innerHTML = '';
    veiculos.forEach(v => {
        let opt = document.createElement('option');
        opt.value = v.id;
        opt.textContent = `${v.nome} (${v.modelo || ''}) - KM: ${v.config?.kmBase || 0}`;
        if(v.id === veiculoAtivoId) opt.selected = true;
        sel.appendChild(opt);
    });
}

function trocarVeiculo(id) {
    veiculoAtivoId = id;
    salvarTudo();
    atualizarPainel();
}

// Funções de Modal KM (Atualiza apenas o KM Atual, preservando o kmAquisicao fixo)
function abrirModalKm() {
    const v = getVeiculoAtivo(); if(!v) return;
    document.getElementById('kmInput').value = v.config?.kmBase || 0;
    document.getElementById('modalKm').style.display = 'flex';
}
function fecharModalKm() { document.getElementById('modalKm').style.display = 'none'; }
function salvarKm() {
    const v = getVeiculoAtivo(); if(!v) return;
    const novoKm = parseFloat(document.getElementById('kmInput').value);
    if(isNaN(novoKm)) return alert('Digite um valor válido');
    
    if(novoKm < v.kmAquisicao) {
        return alert(`O KM atual não pode ser menor que o KM de Aquisição (${v.kmAquisicao} km).`);
    }

    v.config.kmBase = novoKm;
    salvarTudo();
    fecharModalKm();
    atualizarPainel();
}

// Salvar Novo Veículo com KM de Aquisição
function salvarVeiculo() {
    let tipo = document.getElementById('vTipo').value;
    let nome = document.getElementById('vNome').value || 'Meu Veículo';
    let modelo = document.getElementById('vModelo').value;
    let dataAquisicao = document.getElementById('vDataAquisicao').value;
    let kmAquisicao = parseFloat(document.getElementById('vKmAquisicao').value) || 0;
    let kmAtual = parseFloat(document.getElementById('vKm').value) || kmAquisicao;

    if(kmAtual < kmAquisicao) kmAtual = kmAquisicao;

    let novo = {
        id: 'v_' + Date.now(),
        tipo, nome, modelo, dataAquisicao,
        kmAquisicao: kmAquisicao, // Fixo
        config: { kmBase: kmAtual },
        abast: [], manut: [], documentos: []
    };

    veiculos.push(novo);
    veiculoAtivoId = novo.id;
    salvarTudo();
    fecharModalVeiculo();
    atualizarPainel();
}

function atualizarVeiculo() {
    let v = getVeiculoAtivo(); if(!v) return;
    v.tipo = document.getElementById('vTipoEdit').value;
    v.nome = document.getElementById('vNomeEdit').value;
    v.modelo = document.getElementById('vModeloEdit').value;
    v.dataAquisicao = document.getElementById('vDataAquisicaoEdit').value;
    // O kmAquisicao NÃO é alterado aqui por segurança, mantendo-se estático.
    let novoKmAtual = parseFloat(document.getElementById('vKmEdit').value);
    if(!isNaN(novoKmAtual) && novoKmAtual >= v.kmAquisicao) {
        v.config.kmBase = novoKmAtual;
    }
    salvarTudo();
    fecharModalVeiculo();
    atualizarPainel();
}

function abrirModalVeiculo() {
    const v = getVeiculoAtivo();
    if(v) {
        document.getElementById('vTipoEdit').value = v.tipo || 'moto';
        document.getElementById('vNomeEdit').value = v.nome || '';
        document.getElementById('vModeloEdit').value = v.modelo || '';
        document.getElementById('vDataAquisicaoEdit').value = v.dataAquisicao || '';
        document.getElementById('vKmAquisicaoEdit').value = v.kmAquisicao || 0;
        document.getElementById('vKmEdit').value = v.config?.kmBase || 0;
    }
    document.getElementById('modalVeiculo').style.display = 'flex';
}
function fecharModalVeiculo() { document.getElementById('modalVeiculo').style.display = 'none'; }
function alternarAccordion(id) { document.getElementById(id).classList.toggle('aberto'); }

// Gráficos e Histórico
function renderizarGraficos() {
    const v = getVeiculoAtivo(); if(!v) return;
    const filtroDias = document.getElementById('filtroPeriodoGraficos')?.value || 'todos';
    const abastFiltrados = filtrarPorDias([...v.abast].sort((a,b) => a.data.localeCompare(b.data)), filtroDias);
    const abastDesc = [...abastFiltrados].sort((a,b) => b.data.localeCompare(a.data));
    
    const containerConsumo = document.getElementById('containerGraficoConsumo');
    const containerGastos = document.getElementById('containerGraficoGastos');
    if(!containerConsumo || !containerGastos) return;
    
    containerConsumo.innerHTML = '';
    containerGastos.innerHTML = '';
    
    if(abastFiltrados.length < 2) {
        containerConsumo.innerHTML = '<p style="color:var(--muted); text-align:center; font-size:12px;">Dados insuficientes.</p>';
        containerGastos.innerHTML = '<p style="color:var(--muted); text-align:center; font-size:12px;">Sem dados.</p>';
        return;
    }

    let maxKm1L = 0, maxGasto = 0;
    let dadosEficiencia = [];
    
    for(let i = 1; i < abastFiltrados.length; i++) {
        let kmRodados = abastFiltrados[i].km - abastFiltrados[i-1].km;
        let litros = abastFiltrados[i].litros;
        let kmL = litros > 0 ? kmRodados / litros : 0;
        dadosEficiencia.push({ data: abastFiltrados[i].data, kmL: kmL });
        if(kmL > maxKm1L) maxKm1L = kmL;
    }
    abastFiltrados.forEach(a => { if(a.total > maxGasto) maxGasto = a.total; });

    dadosEficiencia.forEach(d => {
        let pct = maxKm1L > 0 ? (d.kmL / maxKm1L) * 100 : 0;
        containerConsumo.innerHTML += `<div class="chart-horiz-row"><div class="chart-horiz-bar" style="width: ${pct}%"></div><div class="chart-horiz-info">${formatarDataCurta(d.data)}: ${d.kmL.toFixed(2)} km/L</div></div>`;
    });

    abastDesc.forEach(a => {
        let pct = maxGasto > 0 ? (a.total / maxGasto) * 100 : 0;
        containerGastos.innerHTML += `<div class="chart-horiz-row"><div class="chart-horiz-bar" style="width: ${pct}%; background: var(--warning);"></div><div class="chart-horiz-info">${formatarDataCurta(a.data)}: R$ ${a.total.toFixed(2)}</div></div>`;
    });
}

function abrirModalHistorico() { document.getElementById('modalHistorico').style.display = 'flex'; renderHistorico(); }
function fecharModalHistorico() { document.getElementById('modalHistorico').style.display = 'none'; }
function renderHistorico() {
    const v = getVeiculoAtivo(); if(!v) return;
    const tipoFiltro = document.getElementById('filtroHistoricoTipo')?.value || 'todos';
    const periodoFiltro = document.getElementById('filtroHistoricoPeriodo')?.value || 'todos';

    let listaAbast = tipoFiltro === 'manut' ? [] : v.abast.map(a => ({...a, tipoItem: 'abast'}));
    let listaManut = tipoFiltro === 'abast' ? [] : v.manut.map(m => ({...m, tipoItem: 'manut'}));
    
    let combinado = [...listaAbast, ...listaManut];
    combinado = filtrarPorDias(combinado, periodoFiltro);
    combinado.sort((a,b) => b.data.localeCompare(a.data));

    const container = document.getElementById('listaHistorico');
    if(!container) return;

    if(combinado.length === 0) {
        container.innerHTML = '<p style="color:var(--muted); text-align:center; font-size:13px; padding:10px;">Nenhum registro encontrado.</p>';
        return;
    }

    container.innerHTML = combinado.map(item => {
        let dataFmt = formatarDataCurta(item.data);
        if(item.tipoItem === 'abast') {
            return `<div class="historico-item"><div class="historico-resumo"><span><i class="fas fa-gas-pump" style="color:var(--primary)"></i> ${dataFmt} - ${item.combustivel || 'Gasolina'}</span><span>R$ ${item.total.toFixed(2)}</span></div><div style="font-size:12px; color:var(--muted); margin-top:4px;">KM: ${item.km.toLocaleString('pt-BR')} | ${item.litros}L</div></div>`;
        } else {
            return `<div class="historico-item"><div class="historico-resumo"><span><i class="fas fa-wrench" style="color:var(--warning)"></i> ${dataFmt} - ${item.tipo}</span><span>R$ ${item.valor?.toFixed(2) || '0,00'}</span></div><div style="font-size:12px; color:var(--muted); margin-top:4px;">KM: ${item.km.toLocaleString('pt-BR')}</div></div>`;
        }
    }).join('');
}

// Funções de Fechamento genéricas para modais de apoio
function fecharModalAbast() { document.getElementById('modalAbast').style.display = 'none'; }
function fecharModalManut() { document.getElementById('modalManut').style.display = 'none'; }
function fecharModalConfig() { document.getElementById('modalConfig').style.display = 'none'; }

window.onload = function() {
    aplicarTema();
    if(veiculos.length === 0) {
        let novo = { id: 'v_' + Date.now(), tipo: 'moto', nome: 'Minha Moto', modelo: 'Exemplo', kmAquisicao: 0, config: { kmBase: 0 }, abast: [], manut: [], documentos: [] };
        veiculos.push(novo);
        veiculoAtivoId = novo.id;
        salvarTudo();
    }
    atualizarPainel();
};
</script>
